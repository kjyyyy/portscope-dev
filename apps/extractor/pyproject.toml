[project]
name = "portscope-extractor"
version = "0.1.0"
description = "Document extraction service for Portscope"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "boto3>=1.36.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.43.0"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.8.0",
]
